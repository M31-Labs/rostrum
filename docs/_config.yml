title: Rostrum
tagline: One record. The whole program.
description: >-
  Judge, organizer, architecture, API, self-hosting, deployment, and
  launch-readiness field guides for Rostrum, the governed event
  speaker-program workspace.
url: https://m31-labs.github.io
baseurl: /rostrum
repository: M31-Labs/rostrum
lang: en-US
timezone: America/Los_Angeles

author:
  name: M31 Labs contributors

github:
  repository_url: https://github.com/M31-Labs/rostrum

markdown: kramdown
theme: null
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap

relative_links:
  enabled: true
  collections: false

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /images/product-tour.webp

exclude:
  - README.md
  - vendor
