# Template for a live organizer deployment — do NOT commit real values.
# Create the real Secret from the
# CLI so secrets never enter git or the manifest:
#
#   kubectl create secret generic rostrum-secrets -n rostrum \
#     --from-literal=SESSION_SECRET="$(openssl rand -hex 24)" \
#     --from-literal=SMTP_HOST=smtp.your-relay.example \
#     --from-literal=SMTP_PORT=587 \
#     --from-literal=SMTP_USER=your-user \
#     --from-literal=SMTP_PASSWORD=your-password \
#     --from-literal=MAIL_FROM='Rostrum <noreply@your-domain>' \
#     --from-literal=ORGANIZER_EMAILS='you@your-domain,teammate@your-domain' \
#     --from-literal=AUTH_GITHUB_CLIENT_ID= \
#     --from-literal=AUTH_GITHUB_CLIENT_SECRET= \
#     --from-literal=AUTH_GOOGLE_CLIENT_ID= \
#     --from-literal=AUTH_GOOGLE_CLIENT_SECRET=
#
# With SMTP_HOST unset, the app falls back to the local outbox (email is
# composed and recorded but not delivered), and the break-glass /setup flow
# signs the first organizer in directly instead of emailing them a link.
# SESSION_SECRET must be at least 32 characters in production. RESET_SECRET is
# empty by default, which disables the HTTP reset route in production; set a
# separate random value only when you intentionally enable that destructive
# operator action. Leave ORGANIZER_EMAILS empty on first deploy to use
# break-glass; the process logs a one-time /setup URL. INITIAL_WORKSPACE only
# takes effect the first time DATA_PATH is created (see docs/deployment.md).
apiVersion: v1
kind: Secret
metadata:
  name: rostrum-secrets
  namespace: rostrum
type: Opaque
stringData:
  # Intentionally too short for production startup: replace it out of band.
  SESSION_SECRET: "REPLACE_ME"
  RESET_SECRET: ""
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_USER: ""
  SMTP_PASSWORD: ""
  MAIL_FROM: "Rostrum <noreply@example.com>"
  ORGANIZER_EMAILS: ""
  # Optional strict mapping: owner@example.com=organizer,chair@example.com=chair
  PRINCIPAL_ROLES: ""
  AUTH_GITHUB_CLIENT_ID: ""
  AUTH_GITHUB_CLIENT_SECRET: ""
  AUTH_GOOGLE_CLIENT_ID: ""
  AUTH_GOOGLE_CLIENT_SECRET: ""
