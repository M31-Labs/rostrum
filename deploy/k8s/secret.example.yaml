# Template for the live organizer deployment only — do NOT commit real values.
# The read-only hosted preview uses rostrum-demo.yaml and a secret containing
# only its separate SESSION_SECRET. Create the real Secret from the
# CLI so secrets never enter git or the manifest:
#
#   kubectl create secret generic rostrum-secrets -n rostrum \
#     --from-literal=SESSION_SECRET="$(openssl rand -hex 24)" \
#     --from-literal=RESET_SECRET="$(openssl rand -hex 12)" \
#     --from-literal=SMTP_HOST=smtp.your-relay.example \
#     --from-literal=SMTP_PORT=587 \
#     --from-literal=SMTP_USER=your-user \
#     --from-literal=SMTP_PASSWORD=your-password \
#     --from-literal=MAIL_FROM='Rostrum <noreply@your-domain>' \
#     --from-literal=ORGANIZER_EMAILS='you@your-domain,teammate@your-domain' \
#     --from-literal=AUTH_GITHUB_CLIENT_ID= \
#     --from-literal=AUTH_GITHUB_CLIENT_SECRET= \
#     --from-literal=AUTH_GOOGLE_CLIENT_ID= \
#     --from-literal=AUTH_GOOGLE_CLIENT_SECRET= \
#     --from-literal=SEED=fresh
#
# With SMTP_HOST unset, the app falls back to the demo outbox (email is
# composed and recorded but not delivered), and the break-glass /setup flow
# signs the first organizer in directly instead of emailing them a link.
# SESSION_SECRET must be at least 32 characters in production. Leave
# ORGANIZER_EMAILS empty on first deploy to use break-glass; the process
# logs a one-time /setup URL. SEED only takes effect the first time
# DATA_PATH is created (see docs/deployment.md).
apiVersion: v1
kind: Secret
metadata:
  name: rostrum-secrets
  namespace: rostrum
type: Opaque
stringData:
  SESSION_SECRET: "REPLACE_WITH_32_PLUS_RANDOM_CHARS"
  RESET_SECRET: "REPLACE_WITH_RANDOM"
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_USER: ""
  SMTP_PASSWORD: ""
  MAIL_FROM: "Rostrum <noreply@example.com>"
  ORGANIZER_EMAILS: ""
  AUTH_GITHUB_CLIENT_ID: ""
  AUTH_GITHUB_CLIENT_SECRET: ""
  AUTH_GOOGLE_CLIENT_ID: ""
  AUTH_GOOGLE_CLIENT_SECRET: ""
  SEED: "fresh"
