# Rostrum live — single-instance organizer deployment.
#
# Evaluation examples live under examples/demo. Never point any anonymous
# preview at this workload's namespace or persistent volume.
#
# The JSON store is single-writer, so run exactly one replica against a
# ReadWriteOnce volume and use the Recreate strategy. Substitute the six
# __PLACEHOLDER__ values (image digest, version, hostname, trusted proxy
# CIDRs, Traefik ingress class, and cert issuer), then apply the
# rostrum-secrets Secret (see
# secret.example.yaml) before this. The cluster must have Traefik's Kubernetes
# CRDs and kubernetesCRD provider enabled for the request-body middleware below.
apiVersion: v1
kind: Namespace
metadata:
  name: rostrum
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rostrum-data
  namespace: rostrum
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rostrum
  namespace: rostrum
  labels:
    app: rostrum
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rostrum
  template:
    metadata:
      labels:
        app: rostrum
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rostrum
          image: __ROSTRUM_IMAGE_BY_DIGEST__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: APP_MODE
              value: "live"
            - name: APP_ENV
              value: "production"
            - name: PORT
              value: "8080"
            - name: PUBLIC_URL
              value: "https://__HOSTNAME__"
            - name: ROSTRUM_VERSION
              value: "__ROSTRUM_VERSION__"
            - name: DATA_PATH
              value: "/app/data/rostrum.json"
            - name: UPLOAD_DIR
              value: "/app/data/uploads"
            - name: INITIAL_WORKSPACE
              value: "fresh"
            # Set to the exact pod/service CIDR(s) from which Traefik reaches
            # this pod. Never substitute a trust-all network.
            - name: TRUSTED_PROXY_CIDRS
              value: "__TRUSTED_PROXY_CIDRS__"
          envFrom:
            - secretRef:
                name: rostrum-secrets
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rostrum-data
---
apiVersion: v1
kind: Service
metadata:
  name: rostrum
  namespace: rostrum
spec:
  selector:
    app: rostrum
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: request-body-limit
  namespace: rostrum
spec:
  buffering:
    # 34 MiB admits Rostrum's 12 MiB portal-upload envelope and its 32 MiB
    # workspace file plus multipart overhead. Per-route app limits remain the
    # tighter authority; Traefik rejects anything larger before forwarding it.
    maxRequestBodyBytes: 35651584
    memRequestBodyBytes: 2097152
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rostrum
  namespace: rostrum
  annotations:
    cert-manager.io/cluster-issuer: "__CLUSTER_ISSUER__"
    traefik.ingress.kubernetes.io/router.middlewares: "rostrum-request-body-limit@kubernetescrd"
    # Traefik handles the /live WebSocket upgrade without nginx annotations.
spec:
  ingressClassName: __INGRESS_CLASS__
  tls:
    - hosts:
        - __HOSTNAME__
      secretName: rostrum-tls
  rules:
    - host: __HOSTNAME__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rostrum
                port:
                  number: 80
