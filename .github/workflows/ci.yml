name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Go, policies, rendered flows, and budgets
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up TinyGo-compatible Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.25.9
          cache: false

      - name: Record TinyGo-compatible SDK
        run: echo "GOSX_TINYGO_GOROOT=$(go env GOROOT)" >> "$GITHUB_ENV"

      - name: Set up Go from go.mod
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned TinyGo
        env:
          TINYGO_VERSION: 0.40.1
          TINYGO_SHA256: 064fc0c07f4d71f7369b168c337caa88ef32a6b00b16449cea44790ccadfc2b4
        run: |
          archive="$RUNNER_TEMP/tinygo.tar.gz"
          curl --fail --location --retry 3 --silent --show-error \
            --output "$archive" \
            "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo${TINYGO_VERSION}.linux-amd64.tar.gz"
          echo "${TINYGO_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/tinygo/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/tinygo/bin/tinygo" version

      - name: Install pinned wasm optimizer
        env:
          BINARYEN_VERSION: 125
          BINARYEN_SHA256: 7c3bc16599c8274a04d34a504fe4be2047884f900e0e2da2f6fb9cd667183be4
        run: |
          archive="$RUNNER_TEMP/binaryen.tar.gz"
          curl --fail --location --retry 3 --silent --show-error \
            --output "$archive" \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          echo "${BINARYEN_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin/wasm-opt" --version

      - name: Install pinned Go build tools
        run: |
          go install m31labs.dev/gosx/cmd/gosx@v0.38.1
          go install m31labs.dev/arbiter/cmd/arbiter@v1.9.0

      - name: Run formatting, policy, vet, unit, and race checks
        run: make check

      - name: Exercise rendered headline flows
        run: make smoke

      - name: Build and enforce distribution budgets
        run: make size-budget
